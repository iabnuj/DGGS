appId: com.dggs.demo
productName: DGGS Demo
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
  - node_modules/better-sqlite3/**
  - node_modules/bindings/**
  - node_modules/file-uri-to-path/**
asar: true
asarUnpack:
  - "**/*.node"
mac:
  target:
    - dmg
    - zip
  category: public.app-category.education
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
