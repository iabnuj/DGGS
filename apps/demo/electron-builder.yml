appId: com.dggs.demo
productName: 格网编码系统
executableName: 格网编码系统
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
  - node_modules/better-sqlite3/**
  - node_modules/bindings/**
  - node_modules/file-uri-to-path/**
extraResources:
  - from: resources/sample-data
    to: sample-data
asar: true
asarUnpack:
  - "**/*.node"
mac:
  target:
    - dmg
    - zip
  category: public.app-category.education
  icon: build/icon.png
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
linux:
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
